<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1080px;font-family:Montserrat,Arial,sans-serif;background:#0f2a3a;color:#fff;overflow:hidden}
.card{position:relative;width:1080px;height:1080px;padding:84px 84px 72px;display:flex;flex-direction:column;
 background:radial-gradient(circle at 85% 10%,#1d4a5e 0%,#0f2a3a 55%,#0a1f2b 100%)}
.tag{display:inline-block;align-self:flex-start;font-size:24px;font-weight:700;letter-spacing:3px;color:#0f2a3a;background:#e8c27a;padding:10px 20px;border-radius:6px}
.hook{margin-top:48px;font-size:62px;line-height:1.14;font-weight:800;letter-spacing:-0.5px}
.hook em{font-style:normal;color:#e8c27a}
.stats{margin-top:64px;display:flex;gap:28px}
.stat{flex:1;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);border-radius:20px;padding:34px 34px 30px}
.num{font-size:92px;font-weight:800;line-height:1}
.down{color:#f08a7a}.up{color:#7fd6a8}
.lbl{margin-top:16px;font-size:25px;font-weight:500;line-height:1.35;color:#cfdbe2}
.take{margin-top:56px;font-size:32px;font-weight:600;line-height:1.4;color:#e9f0f3}
.foot{margin-top:auto;display:flex;justify-content:space-between;align-items:flex-end;border-top:1px solid rgba(255,255,255,0.15);padding-top:30px}
.brand{font-size:30px;font-weight:800;letter-spacing:0.5px}
.brand span{color:#e8c27a}
.sub{font-size:22px;color:#9fb3bf;margin-top:6px;font-weight:500}
.src{font-size:20px;color:#9fb3bf;text-align:right;line-height:1.4}
</style></head><body>
<div class="card">
 <div class="tag">{{tag}}</div>
 <div class="hook">{{hook}}</div>
 <div class="stats">{{stats}}</div>
 <div class="take">{{take}}</div>
 <div class="foot">
  <div><div class="brand">Save With Property <span>|</span> Joel Li</div><div class="sub">savewithproperty.sg</div></div>
  <div class="src">{{sources}}</div>
 </div>
</div>
</body></html>
