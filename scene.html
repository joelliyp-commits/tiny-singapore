// 16. wind: blocks with gaps, wind streaks flowing through; breezy vs stuffy stacks
regTpl('wind', { bg: 0xDDE9EC, k: 1.3, cam: [V(-1.2, 7.4, 10.6), V(.8, 7, 9.6), V(0, 1.1, 0), V(0, 1.3, 0)] }, (g, p) => {
  g.add(plate(7.6, 7.6)); const blocks = [[-2.3, 2.2], [-.78, 3.4], [.78, 1.6], [2.3, 2.8]];
  for (const [x, h] of blocks) { const c = condo(p.flat ? 2.2 : h, .85); c.position.set(x, 0, -1.6); g.add(c); }
  const front = []; for (const [x, lab2, col] of [[-1.55, 'BREEZY', '#2C5F5D'], [2.3, 'STUFFY', '#C8423B']]) { const c = condo(1.4, .75); c.position.set(x, 0, 1.4); g.add(c); front.push(c);
    if (p.labels) { const l = lab(lab2, .42, col, '#fff'); l.position.set(x > 0 ? 1.9 : x, 2.25, 1.6); g.add(l); } }
  let nb = null; if (p.next) { nb = condo(2, .85); nb.position.set(-1.55, 0, -.1); g.add(nb); const q = lab('?', .5, '#E0714F', '#fff'); q.position.set(-1.7, 2.6, -.1); nb.add(q); q.position.set(0, 2.6, 0); }
  const sm = new THREE.MeshStandardMaterial({ color: 0x4FA3D1, emissive: 0x2E86C1, emissiveIntensity: .35, transparent: true, opacity: .9, roughness: .3 }); const streaks = [];
  const lanes = [-1.55, 0, 1.55]; for (let i = 0; i < 30; i++) { const s = new THREE.Mesh(new THREE.BoxGeometry(.13, .1, 1.1), sm); s.castShadow = false; const lane = lanes[i % 3]; s.userData = { x: lane + (Math.random() - .5) * .45, y: .4 + Math.random() * 1.4, ph: Math.random(), down: i % 3 === 1 && !p.flat }; g.add(s); streaks.push(s); }
  let tg = null; if (p.tag) { tg = lab(p.tag, .5, '#24504d', '#FFD36B'); const w = tg.geometry.parameters.width; tg.userData.s = w > 5.8 ? 5.8 / w : 1; tg.position.set(0, 4.3, -1.2); g.add(tg); }
  return { anim: (lt) => { streaks.forEach(s => { const u = (lt * .45 + s.userData.ph) % 1; const z = -3.6 + u * 7.2; let y = s.userData.y; if (s.userData.down && z < -1) y = s.userData.y + 2 * (-1 - z) / 2.6; s.position.set(s.userData.x, Math.max(.3, y), z);
        const blocked = p.next && Math.abs(s.userData.x + 1.55) < .5 && z > -.6; const toStuffy = false; s.visible = !blocked && !toStuffy; s.scale.z = .6 + .4 * Math.sin(u * Math.PI); });
      if (tg) popIn(tg, lt, .2, tg.userData.s); if (nb) nb.scale.y = Math.max(.001, back((lt - .6) / .5)); } };
});




const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));const eo=t=>1-Math.pow(1-cl(t),3);
const back=t=>{t=cl(t);const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)};

let TL=[],LINES=[];
window.setup=(timing,scale)=>{window.MOTION=timing.some(t=>t.motion);timing.forEach((t,i)=>{if(t.tpl){const key='L'+i;const T=TPL[t.tpl];const g=new THREE.Group();g.visible=false;scene.add(g);groups.push(g);const r=T.build(g,t.p||{})||{};S[key]={g,...r};CAM[key]=T.cam;K[key]=T.k;BG[key]=t.bg||T.bg;t.scene=key;}});TL=timing;window.BOARD=timing.some(t=>t.style==='board');if(window.MOTION)initMotion();if(window.BOARD){if(SKY){scene.remove(SKY);SKY=null}renderer.setClearColor(0x000000,0)}const c=document.getElementById('c');renderer.setSize(Math.round(1080*scale),Math.round(1920*scale),false);for(const id of['cap','stat','tt','tb','vig','flash','src'])document.getElementById(id).style.display='none';return true};
window.grab=(T)=>{window.renderAt(T);return document.getElementById('c').toDataURL(window.BOARD?'image/png':'image/jpeg',0.92).split(',')[1]};
const capEl=document.getElementById('cap'),statEl=document.getElementById('stat'),flashEl=document.getElementById('flash'),srcEl=document.getElementById('src');
let lastId=-1;
window.renderAt=(T)=>{
  let i=TL.findIndex((x,k)=>T>=x.start&&(k===TL.length-1||T<TL[k+1].start));if(i<0)i=0;
  const seg=TL[i],id=seg.scene,lt=T-seg.start,p=cl(lt/seg.dur),sc=S[id];
  groups.forEach(g=>g.visible=false);sc.g.visible=true;
  const [a,b,la,lb]=CAM[id];const e=ease(p);const look=la.clone().lerp(lb,e);camera.position.lerpVectors(a,b,e).sub(look).multiplyScalar(K[id]||1.45).add(look);look.y-=SHIFT;camera.position.y-=SHIFT;
  // punch-in on cut
  if(window.MOTION){motionCam(lt,p,look,T)}else{const punch=1-eo(lt/.35);camera.position.addScaledVector(camera.position.clone().sub(look).normalize(),punch*1.2);camera.lookAt(look);}
  if(window.BOARD){scene.background=null;scene.fog=new THREE.Fog(0xF4F2EC,22,40)}else{scene.background=new THREE.Color(BG[id]);scene.fog=new THREE.Fog(BG[id],22,40);}
  const dusk=id===5;sun.color.set(dusk?0xff9d6b:0xffe2b8);sun.intensity=dusk?1.1:2.4;hemi.intensity=dusk?.55:1.25;hemi.color.set(dusk?0xb69ad1:0xfff4e0);
  // per-scene animation
  if(id===1){sc.towers.forEach((t,k)=>{const s=back((lt-.1-k*.12)/.5);t.scale.y=Math.max(.001,s)});sc.train.position.x=-7+lt*3.2;sc.ar.scale.setScalar(Math.max(.001,back((lt-1.2)/.5)));sc.ar.position.y=Math.sin(lt*3)*.08}
  if(id===2){sc.fam.position.x=-4.2+lt*1.1;sc.fam.children.forEach((c,k)=>c.position.y=Math.abs(Math.sin(lt*9+k))*.05);sc.cal.rotation.x=lt<.6?(1-eo(lt/.6))*-1.4:0;sc.cal.position.y=2.4+Math.sin(lt*2)*.05}
  if(id===3){const ang=-.18*eo(lt/1.2);sc.beam.rotation.z=ang;sc.panL.rotation.z=-ang;sc.panR.rotation.z=-ang;sc.q.scale.setScalar(Math.max(.001,back((lt-.8)/.4)));sc.q.rotation.y=Math.sin(lt*2)*.2}
  if(id===4){sc.cr.forEach((c,k)=>c.userData.jib.rotation.y=k*.8);sc.sg.scale.setScalar(Math.max(.001,back((lt-.3)/.5)))}
  if(id===5){sc.ls.forEach((l,k)=>l.rotation.z=Math.sin(lt*2+k)*.12);sc.smoke.forEach((s,k)=>{const ph=((lt*.5+k/14)%1);s.position.set(1.8+Math.sin(ph*6+k)*.12,.35+ph*2.2,1.4);s.scale.setScalar(.6+ph*1.6);s.material.opacity=.45*(1-ph)})}
  if(id===6){sc.hs.forEach(({h,c},k)=>{const on=c&&lt>.8+k*.16;h.children[0].material.forEach?0:0;h.position.y=on?Math.max(0,back((lt-.8-k*.16)/.3)*.25-.0):0;h.children[1].material=on?mat(C.gold):mat(C.dteal)});sc.tag.rotation.y=Math.sin(lt*1.5)*.25;sc.tag.position.y=3.6+Math.sin(lt*2)*.1;sc.tag.scale.setScalar(Math.max(.001,back((lt-.1)/.5)))}
  if(id===7){sc.hs.forEach((h,k)=>{h.scale.setScalar(Math.max(.001,back((lt-.1-k*.13)/.4)))})}
  if(id===8){const x=-3.5+eo(lt/2.4)*4.6;sc.mg.position.x=x+Math.sin(lt*2)*.1;sc.bars.forEach(b=>{const big=b.geometry.parameters.height>1;b.scale.y=1;})}
  if(id===9){sc.ocr.position.y=eo((lt-.6)/.6)*.35;sc.labels.forEach((l,k)=>{l.scale.setScalar(Math.max(.001,back((lt-.3-k*.25)/.4)));l.lookAt(camera.position)});sc.hs.forEach(h=>h.position.y=.36+sc.ocr.position.y);sc.rm.position.y=sc.ocr.position.y;sc.cm.position.y=sc.ocr.position.y}
  if(id===10){sc.cr.forEach((c,k)=>c.userData.jib.rotation.y=lt*.6*(k?1:-1));sc.crowd.forEach((p,k)=>{const s=Math.max(.001,back((lt-.2-k*.07)/.3));p.scale.setScalar(.75*s);p.position.y=Math.abs(Math.sin(lt*7+k))*.04});sc.tag.rotation.z=Math.sin(lt*3)*.25}
  if(id===11){sc.q.scale.setScalar(Math.max(.001,back((lt-.5)/.4)));sc.q.position.y=2.7+Math.sin(lt*2.5)*.1;sc.fam.rotation.y=Math.sin(lt*.8)*.25;sc.sSell.rotation.z=Math.sin(lt*2)*.04;sc.sHold.rotation.z=-Math.sin(lt*2)*.04}

  if(id==='w1'){sc.x.scale.setScalar(Math.max(.001,back((lt-.7)/.35))*.72);sc.cal.rotation.z=Math.sin(lt*2)*.04}
  if(id==='w2'){const hg=sc.hg;hg.rotation.y=lt*.3;const k=cl(lt/seg.dur);hg.userData.sandT.scale.setScalar(Math.max(.05,1-k));hg.userData.sandB.scale.setScalar(.3+k*.9);sc.fam.position.set(-2.1+eo(lt/1.6)*1.3,0,1.5);sc.fam.children.forEach((c,j)=>c.position.y=lt<1.6?Math.abs(Math.sin(lt*9+j))*.05:0)}
  if(id==='w3'){sc.st.forEach((s,k)=>s.scale.y=Math.max(.001,back((lt-.1-k*.12)/.4)));sc.ar.scale.setScalar(Math.max(.001,back((lt-.9)/.4)))}
  if(id==='w4'){sc.bars.forEach((b,k)=>{const s=Math.max(.001,eo((lt-.1-k*.15)/.45));b.scale.y=s;b.position.y=b.userData.h*s/2});sc.dn.position.y=2.2-eo((lt-1.3)/.6)*.6}
  if(id==='w5'){const o=eo((lt-.3)/.8);sc.t.userData.wheel.rotation.y=o*Math.PI*1.5;sc.t.userData.water.scale.set(1,Math.max(.001,o),1);sc.t.userData.water.position.y=3.05-1.6*o+.0;sc.t.userData.pool.scale.setScalar(Math.max(.001,eo((lt-.9)/1.2)))}
  if(id==='w6'){sc.crowd.forEach((p,k)=>{const r=p.userData.r0-eo((lt-.1-k*.05)/1.8)*2.1;p.position.set(Math.cos(p.userData.a)*r,Math.abs(Math.sin(lt*8+k))*.04,-1+Math.sin(p.userData.a)*-r*.55+1.2);p.lookAt(0,0,-1)})}
  if(id==='w7'){sc.groupsB.forEach((bl,gi)=>bl.forEach((h,k)=>h.scale.y=Math.max(.001,back((lt-.15-gi*.45-k*.06)/.4))))}
  if(id==='w8'){sc.q.scale.setScalar(Math.max(.001,back((lt-.5)/.4)));sc.q.position.y=3.1+Math.sin(lt*2.5)*.1;sc.fam.rotation.y=Math.sin(lt*.9)*.35;sc.sL.rotation.z=Math.sin(lt*2)*.04;sc.sR.rotation.z=-Math.sin(lt*2)*.04}
  if(window.MOTION)motionPre(sc,lt,T);
  if(sc.anim)sc.anim(lt,p);
  if(window.MOTION)motionPost(sc,lt,T);
  renderer.render(scene,camera);return id;
};

// ===== MOTION LAYER (opt-in via timing[].motion) =====
const YAX=new THREE.Vector3(0,1,0);let SKY=null;
function initMotion(){
  groups.forEach(g=>g.children.forEach((c,k)=>{c.userData.bs=c.scale.clone();c.userData.bp=c.position.clone();}));
  SKY=new THREE.Group();scene.add(SKY);SKY.userData.clouds=[];SKY.userData.birds=[];
  const cm=new THREE.MeshStandardMaterial({color:0xffffff,roughness:1,emissive:0xffffff,emissiveIntensity:.75,transparent:true,opacity:.95});
  for(let i=0;i<7;i++){const c=new THREE.Group();const n=3+(i%2);for(let j=0;j<n;j++){const m=new THREE.Mesh(new THREE.SphereGeometry(.55+((i+j)%3)*.18,16,12),cm);m.position.set(j*.6-.6,((j%2)*.18),0);m.scale.y=.72;c.add(m);}
    c.userData.x0=-12+i*3.7;c.userData.y=3.6+((i*7)%5)*.35;c.userData.z=-10.5+((i*3)%4)*.8;c.scale.setScalar(1.3);c.userData.v=.18+(i%3)*.06;SKY.add(c);SKY.userData.clouds.push(c);}
  const bm=mat(0x3a4a48);
  for(let i=0;i<5;i++){const b=new THREE.Group();const wl=rbox(.32,.03,.1,bm,.01);wl.position.x=-.15;const wr=rbox(.32,.03,.1,bm,.01);wr.position.x=.15;const bd=rbox(.1,.06,.16,bm,.02);b.add(wl,wr,bd);b.userData={wl,wr,ph:i*1.7,y:5.4+(i%3)*.5,z:-4-(i%2)*1.5,x0:-14-i*2.2};SKY.add(b);SKY.userData.birds.push(b);}
}
function motionCam(lt,p,look,T){
  const off=camera.position.clone().sub(look);const sw=1-eo(lt/.75);
  off.applyAxisAngle(YAX,-.16+.32*ease(p)+sw*.6);off.y+=sw*1.6;off.multiplyScalar(1+sw*.2-.07*ease(p));
  camera.position.copy(look).add(off);camera.position.x+=Math.sin(T*1.3)*.05;camera.position.y+=Math.sin(T*1.75)*.04;camera.lookAt(look);
}
function motionPre(sc,lt,T){
  const kids=sc.g.children;kids.forEach((c,k)=>{if(k===0||!c.userData.bs)return;if(lt<1.8){const s=Math.max(.001,back((lt-.08-k*.06)/.45));c.scale.copy(c.userData.bs).multiplyScalar(s);}else if(!c.userData.done){c.scale.copy(c.userData.bs);}});
}
function motionPost(sc,lt,T){
  if(!sc._m){sc._m={fams:[],trees:[]};sc.g.traverse(o=>{if(o.userData.fam){o.userData.fp=o.position.clone();sc._m.fams.push(o)}if(o.userData.tree)sc._m.trees.push(o)});}
  sc._m.fams.forEach(f=>{const w=1-eo(lt/1.2);f.position.x=f.userData.fp.x-w*1.8;f.children.forEach((pp,k)=>{pp.position.y=Math.abs(Math.sin(T*(w>.02?9:4)+k*1.3))*(w>.02?.07:.035);pp.rotation.y=(w>.02?.9:0)+Math.sin(T*1.1+k)*.3;})});
  sc._m.trees.forEach((t,k)=>{t.rotation.z=Math.sin(T*1.6+k)*.07;t.rotation.x=Math.cos(T*1.2+k)*.03});
  if(SKY){SKY.userData.clouds.forEach(c=>{let x=c.userData.x0+T*c.userData.v;x=((x+14)%28+28)%28-14;c.position.set(x,c.userData.y,c.userData.z)});
    SKY.userData.birds.forEach(b=>{const u=b.userData;let x=u.x0+T*1.6;x=((x+16)%40+40)%40-16;b.position.set(x,u.y+Math.sin(T*1.5+u.ph)*.25,u.z);const fl=Math.sin(T*12+u.ph)*.5;u.wl.rotation.z=fl;u.wr.rotation.z=-fl;b.rotation.y=-Math.PI/2*0;});}
}
